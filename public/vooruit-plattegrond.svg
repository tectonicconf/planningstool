<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 800" width="1800" height="800" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a2e"/>
      <stop offset="1" stop-color="#04050f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.08" cy="1" r="0.8">
      <stop offset="0" stop-color="#2546eb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2546eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="brick" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 14 L14 0" stroke="#93c5fd" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <pattern id="ground" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="2"/>
    </pattern>
    <g id="win">
      <path d="M0 18 V6 a6 6 0 0 1 12 0 V18 Z" fill="#0b1240" stroke="#93c5fd" stroke-opacity="0.55" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="1800" height="800" fill="url(#bg)"/>
  <rect width="1800" height="800" fill="url(#glow)"/>

  <text x="60" y="70" fill="#ffffff" font-size="40" font-weight="800">Vooruit</text>
  <text x="60" y="104" fill="#93c5fd" fill-opacity="0.8" font-size="22">Sint-Pietersnieuwstraat 23, Ghent · cross-section of the building</text>

  <!-- ===== OUTLINES (architecture) ===== -->
  <g fill="none" stroke="#93c5fd" stroke-opacity="0.7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- front tower: spire + lantern -->
    <line x1="440" y1="150" x2="440" y2="202"/>
    <path d="M426 202 L440 176 L454 202"/>
    <!-- small corner turret (left) -->
    <path d="M335 318 V250 H370 V318"/>
    <path d="M330 250 L352 214 L375 250 Z"/>
    <line x1="352" y1="214" x2="352" y2="186"/>
    <!-- main left block -->
    <path d="M325 318 V610 H588 V318"/>
    <!-- dome outline -->
    <path d="M333 318 C 333 238, 392 202, 440 202 C 488 202, 548 238, 553 318"/>
    <!-- floor lines -->
    <path d="M325 392 H588 M325 468 H588"/>
    <!-- glass link bridge -->
    <path d="M588 540 V610 H668 V540 Q628 478 588 540 Z"/>
    <!-- stage tower (truss) -->
    <path d="M670 190 V700 H740 M670 190 H888 V262"/>
    <path d="M670 222 H888"/>
    <!-- right main hall roof with three gables -->
    <path d="M888 334 H1275 V540"/>
    <path d="M920 334 L968 270 L1016 334 M1022 334 L1070 270 L1118 334 M1124 334 L1172 270 L1220 334"/>
    <!-- right tower -->
    <path d="M1275 334 V214 H1405 V540"/>
    <path d="M1275 214 L1340 168 L1405 214"/>
    <circle cx="1388" cy="204" r="6"/>
    <!-- right ground -->
    <path d="M888 700 H1405 V540"/>
  </g>

  <!-- brick hatch for flavour -->
  <rect x="325" y="318" width="263" height="292" fill="url(#brick)"/>
  <rect x="670" y="190" width="218" height="510" fill="url(#brick)"/>

  <!-- ===== ROOMS ===== -->
  <!-- Dome Hall -->
  <path d="M333 318 C 333 238, 392 202, 440 202 C 488 202, 548 238, 553 318 Z" fill="#34d399" fill-opacity="0.55" stroke="#6ee7b7" stroke-width="2.5"/>
  <!-- Ballroom -->
  <rect x="333" y="392" width="92" height="76" rx="6" fill="#a78bfa" fill-opacity="0.75" stroke="#c4b5fd" stroke-width="2.5"/>
  <!-- Café -->
  <rect x="333" y="468" width="248" height="142" rx="6" fill="#60a5fa" fill-opacity="0.6" stroke="#93c5fd" stroke-width="2.5"/>
  <!-- Theatre hall -->
  <path d="M740 262 H885 V334 H1268 V540 H740 Z" fill="#fdba74" fill-opacity="0.6" stroke="#fed7aa" stroke-width="2.5"/>
  <!-- Theatre foyer -->
  <rect x="1275" y="440" width="122" height="100" rx="6" fill="#fb7185" fill-opacity="0.75" stroke="#fda4af" stroke-width="2.5"/>
  <!-- Concert hall -->
  <rect x="740" y="540" width="657" height="160" rx="6" fill="#fde047" fill-opacity="0.55" stroke="#fef08a" stroke-width="2.5"/>

  <!-- windows on left block -->
  <g>
    <use href="#win" x="364" y="338"/><use href="#win" x="392" y="338"/><use href="#win" x="486" y="338"/><use href="#win" x="514" y="338"/>
    <use href="#win" x="448" y="410"/><use href="#win" x="480" y="410"/><use href="#win" x="512" y="410"/><use href="#win" x="544" y="410"/>
  </g>

  <!-- ground -->
  <rect x="270" y="610" width="400" height="14" fill="url(#ground)"/>
  <rect x="888" y="700" width="540" height="14" fill="url(#ground)"/>
  <rect x="670" y="700" width="218" height="14" fill="url(#ground)"/>

  <!-- ===== LABELS ===== -->
  <g font-weight="700" text-anchor="middle">
    <text x="443" y="290" fill="#d1fae5" font-size="26">Dome Hall</text>
    <text x="379" y="436" fill="#ede9fe" font-size="17">Ballroom</text>
    <text x="457" y="548" fill="#dbeafe" font-size="28">Café</text>
    <text x="1010" y="450" fill="#ffedd5" font-size="32">Theatre Hall</text>
    <text x="1336" y="484" fill="#ffe4e6" font-size="20">Theatre</text>
    <text x="1336" y="508" fill="#ffe4e6" font-size="20">foyer</text>
    <text x="1068" y="634" fill="#fefce8" font-size="32">Concert Hall</text>
  </g>

  <!-- ===== ENTRANCES ===== -->
  <!-- main entrance (closed) -->
  <line x1="40" y1="520" x2="300" y2="520" stroke="#fb7185" stroke-width="5" stroke-dasharray="12 9"/>
  <path d="M300 504 L322 520 L300 536 Z" fill="#fb7185"/>
  <circle cx="170" cy="520" r="24" fill="#be123c" stroke="#fda4af" stroke-width="3"/>
  <path d="M159 509 L181 531 M181 509 L159 531" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="60" y="456" fill="#fda4af" font-size="24" font-weight="700">Main entrance</text>
  <text x="60" y="484" fill="#fda4af" fill-opacity="0.85" font-size="20">Not in use</text>

  <!-- volunteer entrance (next to the café) -->
  <rect x="292" y="560" width="33" height="50" rx="4" fill="#0b1240" stroke="#67e8f9" stroke-width="3"/>
  <line x1="40" y1="590" x2="268" y2="590" stroke="#67e8f9" stroke-width="6"/>
  <path d="M268 572 L290 590 L268 608 Z" fill="#67e8f9"/>
  <text x="60" y="650" fill="#67e8f9" font-size="28" font-weight="800">Volunteer entrance</text>
  <text x="60" y="682" fill="#67e8f9" fill-opacity="0.9" font-size="22">Check in here · next to the café</text>
  <text x="60" y="712" fill="#67e8f9" fill-opacity="0.75" font-size="20">Sint-Pietersnieuwstraat 23</text>

  <!-- concert hall entrance -->
  <line x1="1790" y1="650" x2="1428" y2="650" stroke="#67e8f9" stroke-width="6"/>
  <path d="M1428 632 L1402 650 L1428 668 Z" fill="#67e8f9"/>
  <text x="1740" y="738" fill="#67e8f9" font-size="26" font-weight="700" text-anchor="end">Concert Hall entrance</text>
  <text x="1740" y="770" fill="#67e8f9" fill-opacity="0.85" font-size="22" text-anchor="end">Waterside</text>
</svg>
